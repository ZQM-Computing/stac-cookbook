site_name: STAC Patterns
site_url: https://stac.zqmlabs.com/
site_description: SpatioTemporal Asset Catalog (STAC) examples for geospatial catalogs, collection and item validation, search APIs, and asset discovery workflows.
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/stac-cookbook

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - meta
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
