[project]
name = "stac-patterns"
version = "0.1.0"
description = "STAC patterns for geospatial data discovery"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ZQM Computing", email = "zqmcomputing@gmail.com"}]
keywords = ["stac", "earth-observation", "satellite", "geospatial", "metadata"]

[project.urls]
Homepage = "https://github.com/ZQM-Computing/stac-patterns"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
