name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then python -m pip install -r requirements.txt; fi
          if [ -f "requirements-test.txt" ]; then python -m pip install -r requirements-test.txt; else python -m pip install pytest; fi
      - name: Run tests
        run: |
          if [ -f "pytest.ini" ] || [ -f "pyproject.toml" ]; then
            python -m pytest
          elif [ -d "tests" ]; then
            python -m pytest tests/
          else
            echo "No test suite found — running basic validation"; ls -la; find . -name "*.py" -o -name "*.js" -o -name "*.sh" | head -20
          fi
